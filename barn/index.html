<script>
const DAY=864e5, TODAY=new Date(); TODAY.setHours(12,0,0,0);
const ago=d=>new Date(TODAY-d*DAY).toISOString().slice(0,10);
const fmt=s=>new Date(s+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtY=s=>new Date(s+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const daysTo=s=>Math.round((new Date(s+'T12:00')-TODAY)/DAY);
const addDays=(s,n)=>new Date(new Date(s+'T12:00').getTime()+n*DAY).toISOString().slice(0,10);
const addMonths=(s,n)=>{const d=new Date(s+'T12:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
// Care rules
const CARE=[
 {k:'farrier',n:'Farrier',e:'🧲',rule:'about every 7 weeks',next:d=>addDays(d,49)},
 {k:'vax',n:'Vaccines',e:'💉',rule:'spring & fall',next:d=>{const x=new Date(d+'T12:00'),y=x.getFullYear(),m=x.getMonth();return m<2?`${y}-04-01`:m<8?`${y}-10-01`:`${y+1}-04-01`}},
 {k:'coggins',n:'Coggins',e:'🧪',rule:'yearly',next:d=>addMonths(d,12)},
 {k:'dental',n:'Dental',e:'🦷',rule:'yearly',next:d=>addMonths(d,12)},
 {k:'fecal',n:'Fecal count',e:'🔬',rule:'every 6 months',next:d=>addMonths(d,6)},
 {k:'saddle',n:'Saddle fit check',e:'🐴',rule:'every 6 months',next:d=>addMonths(d,6)},
 {k:'reflock',n:'Saddle reflock',e:'🧵',rule:'about every 2 years',next:d=>addMonths(d,24)}];
const nov1=(()=>{const d=new Date(TODAY);d.setMonth(d.getMonth()+1,1);return d.toISOString().slice(0,10)})();
function sample(){
 const H=(id,name,coat,blaze,mane,owner,phone,bill,last)=>({id,name,coat,blaze,mane,owner,phone,bill,last});
 const L=(f,v,c,d,fe,s,r)=>({farrier:ago(f),vax:ago(v),coggins:ago(c),dental:ago(d),fecal:ago(fe),saddle:ago(s),reflock:ago(r)});
 return {horses:[
  H('biscuit','Valegro','#8a5a3b','#fffaf0','#2b1d16','Charlotte Dujardin','(555) 201-4418',{board:350,status:'paid'},L(44,30,120,200,60,90,300)),
  H('clem','Weihegold','#c8743f','#fffaf0','#7a4a2e','Isabell Werth','(555) 304-9921',{board:450,status:'late',daysLate:12},L(44,40,100,150,70,40,500)),
  H('honey','Ravel','#e2b965','#fffaf0','#9b6440','Steffen Peters','(555) 772-1180',{board:300,status:'paid',next:nov1},L(20,35,200,350,50,60,200)),
  H('midnight','HH Azur','#3a2a22','#f4efe6','#1a110c','McLain Ward','(555) 615-0043',{board:300,status:'paid'},L(10,25,90,100,30,20,400)),
  H('juniper',"Cortes 'C'",'#9b6440','#f6ecd2','#2b1d16','Beezie Madden','(555) 418-7750',{board:300,status:'paid'},L(58,30,150,180,90,100,600)),
  H('maple','Cedric','#b5651d','#fffaf0','#5a3018','Laura Kraut','(555) 990-3312',{board:275,status:'paid',next:nov1},L(30,28,330,120,100,170,710)),
  H('rosie','Gazelle','#d9cfc4','#fffaf0','#8a7d70','Kent Farrington','(555) 247-6605',{board:275,status:'paid'},L(15,31,60,40,170,30,100)),
  H('pebble','Sam','#c9c6c0','#f4efe6','#7c7770','Michael Jung','(555) 330-2716',{board:325,status:'paid'},L(35,240,140,250,80,null,null)),
  H('patches','SAP Hale Bob','#f4efe6','#fffaf0','#7a4a2e','Ingrid Klimke','(555) 481-0927',{board:325,status:'paid',next:nov1},L(25,30,60,80,40,null,null)),
  H('sprout','Tsetserleg','#d08a4e','#f6ecd2','#7a4a2e','Boyd Martin','(555) 726-5534',{board:300,status:'paid'},L(40,28,200,90,178,null,null))],
 posts:[
  {id:1,when:ago(1),text:'Farrier coming Tuesday 9am 🧲 Reply YES to sign up!',ask:true,yes:['charlotte','isabell','beezie']},
  {id:2,when:ago(5),text:'Arena footing is being dragged Saturday morning — please ride after 11. Thank you! 🌿',ask:false,yes:[]}],
 sent:[],cfg:defCfg(),plans:seedPlans()};
}
const LOOKS={biscuit:['bay','black','star','front','sage','none','walnut','classic'],clem:['black','flax','blaze','hind','rose','rose','walnut','scallop'],
 honey:['bay','black','snip','none','sky','sky','sage','rounded'],midnight:['bay','black','star','all','lavender','sunny','navy','classic'],
 juniper:['chestnut','auburn','none','hind','none','none','walnut','rounded'],maple:['chestnut','auburn','blaze','front','sunny','lavender','rose','scallop'],
 rosie:['gray','gray','none','none','rose','rose','rose','rounded'],pebble:['bay','black','snip','none','none','none','sage','classic'],
 patches:['bay','black','none','all','sky','none','sky','scallop'],sprout:['bay','black','star','none','sage','sunny','walnut','rounded']};
const KEYS=['coat','mane','mark','socks','blanket','bow','plate','plateStyle'];
const COATS={bay:'#8a5a3b',chestnut:'#c8743f',black:'#3a2a22',gray:'#c9c6c0',palomino:'#e2b965',white:'#f4efe6',buckskin:'#c9a66b',dun:'#d08a4e',roan:'#b7a49a'};
const MANES={black:'#2b1d16',flax:'#f3e2b3',cream:'#fff3d6',auburn:'#7a4a2e',gray:'#8a8580',pink:'#f3a5c0',lavender:'#b9a3e0'};
const FAB={none:null,rose:'#e99aa8',sky:'#8fc1e3',sage:'#8fb87a',sunny:'#f2c94c',lavender:'#b9a3e0',navy:'#3d5a80',walnut:'#7a5235'};
const PLATES={walnut:'#7a5235',sage:'#5e8a4c',rose:'#c46a7d',sky:'#4f86ad',navy:'#3d5a80'};
const THEMES={sage:['#cfdcc3','#e6ecd9','#b9c9a9','#8fb87a','#6d9a5a'],rose:['#f1cfd3','#f8e3e5','#dfb2b8','#d98a98','#b76878'],sky:['#c6dcea','#e1edf5','#a9c5d8','#6fa3c8','#4f86ad'],
 lavender:['#d9cfee','#ece6f7','#c0b3dd','#9e88cf','#7d67b0'],sunny:['#f3e0a8','#f9efcf','#ddc68a','#d9a93f','#b3862a']};
const ICONS=['🌿','🐴','🌻','🍎','🏡','🌙','⭐','🥕'];
function defCfg(){return{name:'Willow Creek Stables',theme:'sage',icon:'🌿'}}
const SPOTS=[['barn','Stalls & barn','🏠'],['arena','Arena','🟫'],['pen','Round pen','⭕'],['wash','Wash rack','🫧'],['trail','Trail','🌲'],['pasture','Pasture','🌼']];
const dayStr=n=>ago(-n);
function seedPlans(){const fri=(5-TODAY.getDay()+7)%7;return[
 {id:1,horse:'biscuit',spot:'arena',day:dayStr(fri),time:'16:00',note:'Flatwork + cool down'},
 {id:2,horse:'clem',spot:'trail',day:dayStr(0),time:'10:00',note:'Easy hack'},
 {id:3,horse:'juniper',spot:'pen',day:dayStr(0),time:'17:30',note:''},
 {id:4,horse:'pebble',spot:'pasture',day:dayStr(0),time:'',note:'Turnout all day'},
 {id:5,horse:'honey',spot:'wash',day:dayStr(1),time:'09:00',note:'Bath day 🫧'},
 {id:6,horse:'midnight',spot:'arena',day:dayStr(2),time:'18:00',note:'Lesson'}]}
function defLook(h){const L=LOOKS[h.id];if(L)return Object.fromEntries(KEYS.map((k,i)=>[k,L[i]]));
 const c=Object.keys(COATS).find(k=>COATS[k]===h.coat)||'bay';return{coat:c,mane:'black',mark:'none',socks:'none',blanket:'none',bow:'none',plate:'walnut',plateStyle:'classic'}}
function migrate(){S.cfg=Object.assign(defCfg(),S.cfg||{});if(!Array.isArray(S.plans))S.plans=seedPlans();
 S.horses.forEach(h=>{h.look=Object.assign(defLook(h),h.look||{})});if(!Array.isArray(S.sent))S.sent=[];if(!Array.isArray(S.posts))S.posts=[]}
localStorage.removeItem('wcs-proto'); let S; try{S=JSON.parse(localStorage.getItem('wcs-proto-v2'))}catch(e){} if(!S||!S.horses)S=sample(); migrate(); localStorage.setItem("wcs-proto-v2",JSON.stringify(S));
let savedAt=Date.now();
const save=()=>{localStorage.setItem('wcs-proto-v2',JSON.stringify(S));savedAt=Date.now()};
const boarded=()=>S.horses.filter(h=>h.owner);
const first=n=>n.split(' ')[0];
function careFor(h){return CARE.filter(c=>h.last[c.k]).map(c=>{const due=c.next(h.last[c.k]);return {...c,last:h.last[c.k],due,d:daysTo(due)}}).sort((a,b)=>a.d-b.d)}
function careDot(h){const c=careFor(h)[0];if(!c)return['green','All care current'];
 if(c.d<0)return['coral',`${c.n} overdue`]; if(c.d<=14)return['amber',`${c.n} ${c.d===0?'due today':'in '+c.d+' days'}`]; return['green','All care current']}
function dueTxt(d){return d<0?`${-d} day${d==-1?'':'s'} overdue`:d===0?'due today':`due in ${d} day${d==1?'':'s'}`}
function badge(h){if(!h.bill)return'';const b=h.bill;
 if(b.status==='late')return`<span class="b c">Owes $${b.board} · ${b.daysLate} days late</span>`;
 if(b.next)return`<span class="b a">Invoice due ${fmt(b.next)}</span>`;return`<span class="b g">✓ Paid up</span>`}
function face(h,cls='h'){const L=h.look||defLook(h),c=COATS[L.coat]||L.coat,m=MANES[L.mane]||'#2b1d16',o='#4a3528',bl=FAB[L.blanket],bw=FAB[L.bow];

 const c=CARE.find(x=>x.k===k);toast(`✓ ${c.n} logged · next ${fmt(c.next(ago(0)))}`,()=>{h.last[k]=prev;save();render();toast('Undone')})}
function fakeSend(id,key){const h=S.horses.find(x=>x.id===id);S.sent.push({to:h.owner,text:draft[key],kind:route.kind||'care',at:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})});const back=route.kind==='bill'?'billing':'horse';delete draft[key];save();go(back,{id});toast(`✓ Pretend-sent to ${first(h.owner)} (prototype)`)}
function addPost(){const t=document.getElementById('newpost').value.trim();if(!t){document.getElementById('newpost').focus();return}
 const p={id:Date.now(),when:ago(0),text:t,ask:document.getElementById('ask').checked,yes:[]};S.posts.unshift(p);save();render();toast('✓ Posted (on this phone only)',()=>{S.posts=S.posts.filter(x=>x!==p);save();render()})}
document.addEventListener('click',e=>{const p=e.target.closest('.pill.wait,.pill.yes');if(!p)return;const card=[...document.querySelectorAll('.card')].indexOf(p.closest('.card'));
 const nm=p.textContent.replace('✓ ','').split(' ')[0].toLowerCase();const post=S.posts[card-1];if(!post)return;post.yes.includes(nm)?post.yes=post.yes.filter(x=>x!==nm):post.yes.push(nm);save();render()});
let mapDay=0,pick=null,pt={time:'',note:''};
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+ap};
const whoOf=h=>h.owner?first(h.owner):'Barn';
function planTxt(p){const h=S.horses.find(x=>x.id===p.horse)||{name:'?'};const sp=SPOTS.find(s=>s[0]===p.spot);
 const dn=daysTo(p.day)===0?'Today':new Date(p.day+'T12:00').toLocaleDateString('en-US',{weekday:'long'});return esc(`${whoOf(h)} & ${h.name} – ${sp?sp[1]:p.spot} – ${dn}${p.time?' '+t12(p.time):''}`)}
function addPlan(hid,spot){const p={id:Date.now(),horse:hid,spot,day:dayStr(mapDay),time:pt.time,note:pt.note.trim()};S.plans.push(p);pick=null;pt={time:'',note:''};save();render();
 toast('✓ '+planTxt(p).replace(/&amp;/g,'&'),()=>{S.plans=S.plans.filter(x=>x!==p);save();render()})}
function tapSpot(k){if(pick)addPlan(pick,k);else toast('Pick a pony first 🐴')}
function delPlan(id){const p=S.plans.find(x=>x.id===id);S.plans=S.plans.filter(x=>x!==p);save();render();toast('Removed from the map',()=>{S.plans.push(p);save();render()})}
function todaySum(){const P=S.plans.filter(p=>p.day===dayStr(0)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
 return`<div class="wrap"><div class="card"><div class="row"><b style="flex:1;font-family:Fredoka,sans-serif;font-size:16px">☀️ Today at the barn</b><button class="btn ghost sm" onclick="mapDay=0;go('map')">Map</button></div>
${P.length?P.map(p=>`<div class="item" style="padding:6px 0"><div class="mini">${head(S.horses.find(x=>x.id===p.horse)||{},'')}</div><div class="own" style="font-size:13px;flex:1">${planTxt(p)}</div></div>`).join(''):'<div class="own">No plans yet today.</div>'}</div></div>`}
let drag=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.pp');if(!b)return;drag={id:b.dataset.h,x:e.clientX,y:e.clientY,g:null};});
document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.g=document.createElement('div');drag.g.className='dragghost';drag.g.innerHTML=head(S.horses.find(h=>h.id===drag.id),'');document.body.appendChild(drag.g)}
 if(drag.g){e.preventDefault();drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';document.querySelectorAll('.zone').forEach(z=>z.classList.remove('hot'));const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-spot]');z&&z.classList.add('hot')}},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.g){d.g.remove();const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-spot]');document.querySelectorAll('.zone').forEach(z=>z.classList.remove('hot'));if(z)addPlan(d.id,z.dataset.spot)}
 else{pick=pick===d.id?null:d.id;render()}});
document.addEventListener('pointercancel',()=>{if(drag&&drag.g)drag.g.remove();drag=null});
let QL=null;
function openQL(id){QL={main:id||null,hs:id?[id]:[],care:null,date:ago(0),dmode:'today',note:''};renderSheet()}
function closeQL(){QL=null;renderSheet()}
function qlTog(id){QL.hs=QL.hs.includes(id)?QL.hs.filter(x=>x!==id):[...QL.hs,id];renderSheet()}
function qlAll(){const all=S.horses.map(h=>h.id);QL.hs=QL.hs.length===all.length?(QL.main?[QL.main]:[]):all;renderSheet()}
function qlSet(k,v){QL[k]=v;if(k==='dmode'){if(v==='today')QL.date=ago(0);if(v==='yday')QL.date=ago(1)}renderSheet()}
function renderSheet(){const el=document.getElementById('sheet');if(!QL){el.innerHTML='';return}
 const m=QL.main&&S.horses.find(h=>h.id===QL.main),c=CARE.find(x=>x.k===QL.care),n=QL.hs.length;
 const others=S.horses.filter(h=>h.id!==QL.main);const allOn=QL.hs.length===S.horses.length;
 const sc=el.querySelector('.sheet')?.scrollTop||0;
 el.innerHTML=`<div class="sheetbg" onclick="if(event.target===this)closeQL()"><div class="sheet" role="dialog" aria-label="Quick log"><div class="grab"></div>
${m?`<div class="row"><div class="mini" style="width:56px;height:56px">${head(m,'')}</div><div style="flex:1"><h2>${esc(m.name)}</h2><div class="own">${esc(m.owner||'Barn horse')}</div></div><button class="btn ghost sm" id="qlprofile" onclick="closeQL();go('horse',{id:'${m.id}'})">Open full profile ›</button></div>`:`<h2>⚡ Quick log</h2><div class="own">Pick the horses, what was done, and when.</div>`}
<div class="lbl">What was done?</div><div class="cc">${CARE.map(x=>`<button class="btn ghost ${QL.care===x.k?'on':''}" data-care="${x.k}" onclick="qlSet('care','${x.k}')">${x.e} ${x.n}</button>`).join('')}</div>
<div class="lbl">When?</div><div class="dd">${[['today','Today'],['yday','Yesterday'],['pick','Pick date']].map(([k,l])=>`<button class="btn ghost sm ${QL.dmode===k?'on':''}" data-dmode="${k}" onclick="qlSet('dmode','${k}')">${l}</button>`).join('')}</div>
${QL.dmode==='pick'?`<input type="date" id="qldate" max="${ago(0)}" value="${QL.date}" style="margin-top:8px" onchange="if(this.value&&this.value<=ago(0)){QL.date=this.value}else{this.value=QL.date}renderSheet()">`:''}
<div class="own" style="margin-top:4px">${fmtY(QL.date)}</div>
<div class="lbl">Note (optional)</div><input id="qlnote" maxlength="80" placeholder="e.g. front shoes reset" value="${esc(QL.note)}" oninput="QL.note=this.value">
<div class="row"><div class="lbl" style="flex:1">${m?'Also for…':'Which horses?'}</div><button class="btn ghost sm" id="qlall" onclick="qlAll()">${allOn?'Clear':'Select all'}</button></div>
<div class="also">${(m?others:S.horses).map(h=>`<button class="${QL.hs.includes(h.id)?'on':''}" data-also="${h.id}" onclick="qlTog('${h.id}')">${head(h,'')}${esc(h.name)}</button>`).join('')}</div>
<button class="btn full" id="qlsave" style="margin-top:10px" ${!c||!n?'disabled style="margin-top:10px;opacity:.55"':''} onclick="qlSave()">${!n?'Pick at least one horse':!c?'Pick what was done':`Log ${c.n.toLowerCase()} for ${n===1?esc(S.horses.find(h=>h.id===QL.hs[0]).name):n+' horses'}`}</button>
<button class="back" style="width:100%" onclick="closeQL()">Cancel</button></div></div>`;
 el.querySelector('.sheet').scrollTop=sc}
function qlSave(){const c=CARE.find(x=>x.k===QL.care);if(!c||!QL.hs.length)return;const d=QL.date>ago(0)?ago(0):QL.date,note=QL.note.trim();
 const prev=QL.hs.map(id=>{const h=S.horses.find(x=>x.id===id);const p={h,last:h.last[c.k],logLen:(h.log||[]).length};
  h.log=h.log||[];h.log.push({k:c.k,date:d,note,at:Date.now()});if(!h.last[c.k]||d>h.last[c.k])h.last[c.k]=d;return p});
 const n=prev.length;closeQL();save();render();
 toast(`✓ ${c.n} logged for ${n===1?prev[0].h.name:n+' horses'} · ${d===ago(0)?'today':d===ago(1)?'yesterday':fmt(d)} · next ${fmt(c.next(d))}`,()=>{prev.forEach(p=>{p.h.last[c.k]=p.last;p.h.log.length=p.logLen});save();render();toast('Undone')})}
const TABS=[['barn','🏡','Barn'],['map','🗺️','Map'],['remind','💬','Reminders'],['posts','📣','Posts'],['billing','💵','Billing']];
function render(){document.getElementById('app').innerHTML=V[route.v]();const tab=['horse','style','custom'].includes(route.v)?'barn':route.v;themeCss();
 document.getElementById('nav').innerHTML=TABS.map(([v,e,l])=>`<button class="${tab===v?'on':''}" onclick="go('${v}')" aria-label="${l}"><span>${e}</span>${l}</button>`).join('')}
render();
</script></body></html>
